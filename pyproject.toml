[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "achilles-cdp"
dynamic = ["version"]
description = "Chrome CDP application services for local AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Pedro Lucas Reis & Reoli Open Source" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]
dependencies = [
  "fastapi>=0.129,<1",
  "uvicorn>=0.40,<1",
  "playwright>=1.59,<2",
  "pydantic>=2.6,<3",
  "rich>=13,<16",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]
build = ["build>=1.2,<2", "pyinstaller>=6.4,<7"]

[project.scripts]
achilles = "achilles.cli.app:main"

[project.urls]
Source = "https://github.com/PedroReoli/Achilles-CDP-Agent"
Issues = "https://github.com/PedroReoli/Achilles-CDP-Agent/issues"
Security = "https://github.com/PedroReoli/Achilles-CDP-Agent/security/advisories/new"

[tool.setuptools.dynamic]
version = { attr = "achilles.__version__" }

[tool.setuptools.packages.find]
include = ["achilles", "achilles.*"]

[tool.setuptools.package-data]
"achilles.browser_extension" = ["manifest.json", "bridge.html"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
